name: Build Windows EXE

# Builds on an actual windows-latest GitHub-hosted runner - not a
# cross-compile/Wine build - since Tkinter/matplotlib packaging really
# needs to happen on the target OS to come out right.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "run_app.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to publish/update the "latest" release below

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SurfInventorySync `
            --paths src `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            run_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurfInventorySync-windows
          path: dist/SurfInventorySync.exe
          retention-days: 90

      # A stable, single-click download link (unlike Actions artifacts,
      # which need a GitHub-authenticated session and a few taps through the
      # Actions UI just to get a .zip - awkward enough on mobile that it
      # didn't work at all for the user). This updates the same "latest"
      # release/tag every successful build, so the link never changes.
      - name: Publish "latest" release with the exe attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "גרסה אחרונה (Latest build)"
          body: |
            נבנה אוטומטית מ-commit ${{ github.sha }}.
            הורדה: SurfInventorySync.exe למטה.
          make_latest: true
          files: dist/SurfInventorySync.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
